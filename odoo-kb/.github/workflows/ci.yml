name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "odoo-kb/**"
  pull_request:
    branches: [main]
    paths:
      - "odoo-kb/**"

defaults:
  run:
    working-directory: odoo-kb

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Lint
        run: ruff check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: odoo-kb
          push: false
          tags: odoo-kb:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: odoo-kb
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/odoo-kb:staging
            ${{ vars.REGISTRY_URL }}/odoo-kb:${{ github.sha }}

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          echo "Override with your deployment tool (docker compose, k8s, etc.)"
          # Example: ssh deploy@staging "cd /opt/kb && docker compose pull && docker compose up -d"

  deploy-production:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: odoo-kb
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/odoo-kb:latest
            ${{ vars.REGISTRY_URL }}/odoo-kb:${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          echo "Override with your deployment tool (docker compose, k8s, etc.)"

services:
  kb-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
    ports:
      - "5433:5432"
    volumes:
      - kb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      timeout: 5s
      retries: 5

  kb-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kb-service:
    build: .
    ports:
      - "8100:8100"
    environment:
      KB_DATABASE_URL: "postgresql+asyncpg://kb:kb@kb-db:5432/kb"
      KB_SEARCH_BACKEND: "pgvector"
      KB_EMBEDDING_PROVIDER: "openai"
      KB_OPENAI_API_KEY: "${OPENAI_API_KEY}"
      KB_REDIS_URL: "redis://kb-redis:6379/0"
      KB_CACHE_BACKEND: "redis"
      KB_LOG_LEVEL: "info"
    depends_on:
      kb-db:
        condition: service_healthy
      kb-redis:
        condition: service_healthy

volumes:
  kb_pgdata:

[project]
name = "odoo-kb"
version = "0.1.0"
description = "Knowledge Base microservice with swappable search backends"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
pdf = ["pdfplumber>=0.11.0"]
html = ["beautifulsoup4>=4.12"]
local-embeddings = ["sentence-transformers>=2.0"]
enrichment = ["tavily-python>=0.3"]
all = [
    "openai>=1.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=2.0",
    "tavily-python>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
